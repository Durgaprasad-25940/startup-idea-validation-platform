<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit details of your startup idea and validate market feasibility.">
    <title>Submit Startup Idea - IdeaValidator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-rocket"></i> IdeaValidator
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="#" onclick="logout(); return false;" class="btn-auth" style="background: linear-gradient(135deg, var(--color-danger) 0%, #f43f5e 100%);">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="align-items: stretch; max-width: 1200px; width: 100%; margin: 0 auto;">
        <div class="dashboard-container">
            
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    <li>
                        <a href="profile.html"><i class="fa-solid fa-user-gear"></i> Profile Settings</a>
                    </li>
                    <li>
                        <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                    </li>
                    <li class="active">
                        <a href="submit-idea.html" id="menu-submit-link"><i class="fa-solid fa-plus"></i> Submit Idea</a>
                    </li>
                    <li id="menu-admin" style="display: none;">
                        <a href="admin.html" style="color: var(--color-secondary);"><i class="fa-solid fa-screwdriver-wrench"></i> Admin Panel</a>
                    </li>
                </ul>
            </aside>

            <!-- CONTENT AREA -->
            <section class="content-area">
                <div class="form-header" style="text-align: left; margin-bottom: 2rem;">
                    <h2 id="page-title">Submit Startup Idea</h2>
                    <p id="page-desc">Describe your business strategy to run our rules-based verification algorithm.</p>
                </div>

                <!-- SUCCESS/ERROR ALERTS -->
                <div id="alert-error" class="alert alert-danger"></div>
                <div id="alert-success" class="alert alert-success"></div>

                <form id="idea-form">
                    <div class="form-group">
                        <label for="idea-title" class="form-label">Startup Title</label>
                        <input type="text" id="idea-title" class="form-input" placeholder="e.g. MicroSaver FinTech" required>
                    </div>

                    <div class="form-group">
                        <label for="idea-industry" class="form-label">Industry Classification</label>
                        <select id="idea-industry" class="form-input" style="cursor: pointer;" required>
                            <option value="" disabled selected>Select Industry</option>
                            <option value="Tech">Technology</option>
                            <option value="Finance">Finance</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Education">Education</option>
                            <option value="E-commerce">E-commerce</option>
                            <option value="Agriculture">Agriculture</option>
                            <option value="Retail">Retail</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="idea-audience" class="form-label">Target Customer Audience</label>
                        <input type="text" id="idea-audience" class="form-input" placeholder="e.g. Freelancers, Small Business Owners, Retirees" required>
                    </div>

                    <div class="form-group">
                        <label for="idea-stage" class="form-label">Current Venture Stage</label>
                        <select id="idea-stage" class="form-input" style="cursor: pointer;" required>
                            <option value="" disabled selected>Select Stage</option>
                            <option value="Ideation">Ideation (Conceptual Phase)</option>
                            <option value="MVP">MVP (Prototype / Beta Developed)</option>
                            <option value="Scaling">Scaling (Active Customer Acquisition)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="idea-description" class="form-label">Business Description & Core Problem Solved</label>
                        <textarea id="idea-description" class="form-input" rows="8" placeholder="Provide a detailed description of what your startup does, who it serves, and what core problems it aims to solve in the market..." required></textarea>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                        <button type="submit" class="btn-primary" id="btn-submit" style="width: auto; min-width: 180px;">
                            <i class="fa-solid fa-floppy-disk"></i> Save Idea Details
                        </button>
                        <a href="dashboard.html" class="btn-outline" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">
                            Cancel
                        </a>
                    </div>
                </form>
            </section>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 IdeaValidator. Protected by JWT Security.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/submit-idea.js"></script>
</body>
</html>
