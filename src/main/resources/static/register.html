<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new account on Startup Idea Validation Platform and start testing your business strategies.">
    <title>Create Account - IdeaValidator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-rocket"></i> IdeaValidator
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html" class="active btn-auth">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="glass-card">
            <div class="form-header">
                <h2>Create Account</h2>
                <p>Join us and test your business potential</p>
            </div>

            <!-- SUCCESS/ERROR ALERTS -->
            <div id="alert-error" class="alert alert-danger"></div>
            <div id="alert-success" class="alert alert-success"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullName" class="form-input" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input" placeholder="johndoe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Min 6 characters" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-user-plus"></i> Register
                </button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IdeaValidator. Protected by JWT Security.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
